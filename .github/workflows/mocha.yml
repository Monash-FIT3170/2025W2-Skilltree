name: Mocha tests

on:
  push: {} #all
  pull_request: {} #all

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install devbox
        uses: jetify-com/devbox-install-action@v0.12.0

      - name: Run Setup
        run: devbox run setup

      - name: Run Meteor tests
        run: devbox run test

      - name: Run Meteor test-start
        run: devbox run test-start
